<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ダービーアーケード</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ダービー">
<meta name="application-name" content="ダービーアーケード">
<meta name="theme-color" content="#0a0e1a">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Oswald:wght@500;700&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
/* ダービーアーケード — 夜のナイター競馬場 × アーケード筐体（単一テーマ） */
:root {
  color-scheme: dark;
  --bg: #0a0e1a; --panel: #131a2e; --panel2: #1b2440; --line: #2a3658; --ink: #f4efe3; --muted: #8e97b3;
  --gold: #f2c14e; --gold2: #b8860b; --accent: #ff4d6d; --turf: #1f7a3a; --turf2: #2c9a4c; --dirt: #8a5a2b;
  --ok: #3ddc84; --warn: #ffb347;
  --ink-dark: #121212; --ink-soft: #c9cde0; --deep: #05070d; --glass: rgba(10, 14, 26, .82);
  --pop1: #f2c14e; --pop2: #c9d3e6; --pop3: #e0915a; --silver: #c9d3e6; --bronze: #d08a52;
  --g1: #2b6cff; --g2: #e3324f; --g3: #1fa463; --gl: #8a5cf6; --gop: #6b7280;
  --up: #3ddc84; --down: #6aa8ff; --flat: #c9cde0; --cash: #8ff0b4; --bill: #3fae6a;
  --font-display: 'Dela Gothic One', 'Hiragino Sans', 'Noto Sans CJK JP', 'Yu Gothic', sans-serif;
  --font-num: 'Oswald', 'Arial Narrow', 'Roboto Condensed', 'Noto Sans CJK JP', sans-serif;
  --font-body: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans CJK JP', sans-serif;
  --r: 10px; --r-sm: 6px;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45);
}
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.bt-cell:focus-visible, .pd-pick:focus-visible, .seg-btn:focus-visible { outline-offset: -3px; }

/* ---------- ステージ ---------- */
.viewport { position: fixed; inset: 0; overflow: hidden;
  background: radial-gradient(ellipse at 50% 30%, var(--panel) 0%, var(--bg) 70%); }
.stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: 50% 50%;
  transform: translate(-50%, -50%); overflow: hidden; background: var(--bg); box-shadow: 0 0 0 1px var(--line), 0 30px 80px rgba(0, 0, 0, .6);
  user-select: none; -webkit-user-select: none; }
.screen { position: absolute; inset: 0; }
.screen.with-bar { top: 52px; padding: 10px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
canvas { display: block; }

/* ---------- ボタン ---------- */
.btn { appearance: none; border: 1px solid var(--line); background: linear-gradient(180deg, var(--panel2), var(--panel)); color: var(--ink);
  height: 40px; padding: 0 16px; border-radius: var(--r-sm); font-weight: 700; font-size: 15px; cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: transform .08s, border-color .15s, background .15s; }
.btn:hover:not(:disabled) { border-color: var(--gold2); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn small { font-family: var(--font-num); font-weight: 500; font-size: 11px; opacity: .7; letter-spacing: .04em; }
.btn-primary { background: linear-gradient(180deg, var(--gold), var(--gold2)); color: var(--ink-dark); border-color: var(--gold); }
.btn-primary:hover:not(:disabled) { border-color: var(--ink); }
.btn-accent { background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 70%, var(--deep))); border-color: var(--accent); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-soft); height: 34px; padding: 0 10px; font-size: 14px; }
.btn-ghost:hover:not(:disabled) { background: var(--panel2); border-color: var(--line); }
.btn-danger { background: var(--accent); border-color: var(--accent); }
.btn-danger-ghost { background: transparent; border-color: color-mix(in srgb, var(--accent) 55%, transparent); color: var(--accent); }
.btn-sm { height: 34px; padding: 0 12px; font-size: 14px; }
.btn-xs { height: 26px; padding: 0 8px; font-size: 12px; border-radius: 5px; }
.btn-lg { height: 52px; font-size: 18px; padding: 0 26px; }
.btn-sq { width: 36px; height: 36px; padding: 0; font-size: 20px; }
.btn-icon { width: 38px; padding: 0; }
.mute-btn .spk-x { display: none; }
.mute-btn.is-muted .spk-x { display: inline; }
.mute-btn.is-muted .spk-wave { display: none; }
.mute-btn.is-muted { color: var(--accent); }

/* ---------- 共通の小物 ---------- */
.coin { display: inline-block; width: 20px; height: 20px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 30%, var(--ink) 0 12%, var(--gold) 35%, var(--gold2) 100%);
  box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--gold2) 80%, var(--deep)), 0 1px 0 var(--deep); }
.coin.sm { width: 14px; height: 14px; vertical-align: -2px; margin-right: 3px; }
.bill { display: inline-block; flex: none; width: 24px; height: 15px; border-radius: 3px; position: relative;
  background: linear-gradient(135deg, color-mix(in srgb, var(--bill) 80%, var(--ink)), var(--bill)); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--bill) 50%, var(--deep)), 0 1px 0 var(--deep); }
.bill::after { content: ''; position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--bill) 45%, var(--deep)); }
.bill.sm { width: 18px; height: 11px; vertical-align: -1px; margin-right: 3px; }
.bill.sm::after { width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-width: 1px; }
.no-chip { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 26px; padding: 0 4px; border-radius: 5px;
  font-family: var(--font-num); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .35); flex: none; }
.no-chip.sm { min-width: 20px; height: 20px; font-size: 13px; border-radius: 4px; }
.no-chip.lg { min-width: 44px; height: 44px; font-size: 26px; border-radius: 8px; }
.no-chip.fr { border-radius: 50%; }
.pop { display: inline-flex; align-items: baseline; justify-content: center; min-width: 24px; height: 22px; padding: 0 5px; border-radius: 11px;
  font-family: var(--font-num); font-weight: 700; font-size: 14px; background: var(--panel2); color: var(--ink-soft); line-height: 22px; }
.pop small { font-family: var(--font-body); font-size: 10px; font-weight: 500; margin-left: 1px; }
.pop.pop1 { background: var(--pop1); color: var(--ink-dark); }
.pop.pop2 { background: var(--pop2); color: var(--ink-dark); }
.pop.pop3 { background: var(--pop3); color: var(--ink-dark); }
.grade { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 4px; font-family: var(--font-num); font-weight: 700; font-size: 13px;
  color: var(--ink); background: var(--gop); margin-left: 8px; vertical-align: middle; letter-spacing: .04em; }
.grade.g1 { background: var(--g1); } .grade.g2 { background: var(--g2); } .grade.g3 { background: var(--g3); } .grade.gl { background: var(--gl); }
.grade.gc { background: var(--panel2); color: var(--ink-soft); font-family: var(--font-body); font-size: 11px; }
.cond { font-weight: 700; font-family: var(--font-num); letter-spacing: -.08em; }
.c-up2, .c-up { color: var(--up); } .c-flat { color: var(--flat); } .c-down, .c-down2 { color: var(--down); }
.mark { display: inline-block; min-width: 16px; text-align: center; font-weight: 700; color: var(--muted); }
.mark.mk1 { color: var(--accent); } .mark.mk2 { color: var(--gold); } .mark.mk3 { color: var(--ok); } .mark.mk4 { color: var(--ink-soft); } .mark.mk5 { color: var(--warn); }
.mark.big { font-size: 34px; line-height: 1; }
.muted { color: var(--muted); }
.plus { color: var(--ok); } .minus { color: var(--accent); } .gold { color: var(--gold); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.panel-h { margin: 0; padding: 10px 14px; font-size: 15px; font-family: var(--font-display); font-weight: 400; letter-spacing: .04em; border-bottom: 1px solid var(--line);
  display: flex; align-items: baseline; gap: 10px; }
.panel-h small { font-family: var(--font-body); font-size: 12px; color: var(--muted); }
.silks { flex: none; vertical-align: middle; }
.combo { display: inline-flex; align-items: center; gap: 2px; flex-wrap: wrap; }
.combo .sep { font-style: normal; color: var(--muted); font-size: 12px; margin: 0 1px; }
.combo em { font-style: normal; font-size: 11px; color: var(--gold); margin: 0 3px 0 2px; }
.combo .no-chip { min-width: 22px; height: 22px; font-size: 14px; }
/* フォーメーションの買い目：列ごとのまとまり（「1着 3,5 → 2着 1,3,7」）。折り返しは列の間で */
.combo.fm { column-gap: 3px; row-gap: 3px; }
.fm-col { display: inline-flex; align-items: center; gap: 2px; flex-wrap: wrap; }
.combo.fm .fm-col em { margin: 0 2px 0 0; white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; background: var(--deep); }
.seg-btn { appearance: none; border: 0; background: transparent; color: var(--ink-soft); height: 34px; padding: 0 12px; font-weight: 700; font-size: 13px; cursor: pointer;
  font-family: var(--font-body); border-right: 1px solid var(--line); }
.seg-btn:last-child { border-right: 0; }
.seg-btn.on { background: var(--gold); color: var(--ink-dark); }
.seg-btn:hover:not(.on) { background: var(--panel2); }

/* ---------- 上部バー ---------- */
.topbar { position: absolute; left: 0; right: 0; top: 0; height: 52px; display: flex; align-items: center; gap: 18px; padding: 0 16px; z-index: 5;
  background: linear-gradient(180deg, var(--panel2), var(--panel)); border-bottom: 2px solid var(--gold2); }
.tb-logo { display: flex; flex-direction: column; line-height: 1; }
.tb-logo b { font-family: var(--font-display); font-weight: 400; font-size: 20px; color: var(--gold); letter-spacing: .06em; }
.tb-logo span { font-family: var(--font-num); font-size: 10px; letter-spacing: .5em; color: var(--muted); margin-top: 2px; }
.tb-meeting { display: flex; align-items: baseline; gap: 10px; font-size: 15px; color: var(--ink-soft); }
.tb-meeting b { font-size: 26px; color: var(--ink); } .tb-meeting b small { font-size: 14px; margin-left: 1px; }
.tb-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.medal-box { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 19px; background: var(--deep); border: 1px solid var(--gold2); }
.medal-box .num { font-size: 22px; color: var(--gold); font-weight: 700; min-width: 64px; text-align: right; }
.medal-box small { color: var(--muted); font-size: 12px; }
.cash-box { display: flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px 0 10px; margin-right: 6px; border-radius: 19px; background: var(--deep); border: 1px solid color-mix(in srgb, var(--ok) 55%, var(--line)); }
.cash-box .num { font-size: 19px; color: var(--cash); font-weight: 700; min-width: 76px; text-align: right; }
.btn-window { border-color: var(--gold2); color: var(--gold); }
.btn-window:hover:not(:disabled) { background: color-mix(in srgb, var(--gold) 16%, var(--panel)); }
.tb-sep { width: 1px; height: 26px; background: var(--line); margin: 0 2px; }
.topbar .btn-sm { height: 32px; padding: 0 11px; font-size: 13px; }

/* ---------- レース見出し ---------- */
.race-head { display: flex; align-items: center; gap: 14px; height: 62px; flex: none; padding: 0 14px 0 0; border-radius: var(--r);
  background: linear-gradient(90deg, var(--panel2), var(--panel)); border: 1px solid var(--line); overflow: hidden; }
.rh-no { height: 100%; min-width: 86px; display: flex; align-items: center; justify-content: center; gap: 2px; background: var(--gold); color: var(--ink-dark); }
.rh-no b { font-size: 38px; line-height: 1; } .rh-no small { font-family: var(--font-num); font-size: 16px; font-weight: 700; }
.rh-main { min-width: 0; flex: 1; }
.rh-name { display: flex; align-items: center; font-family: var(--font-display); font-size: 24px; line-height: 1.15; white-space: nowrap; }
.rh-name span { overflow: hidden; text-overflow: ellipsis; }
.rh-cond { font-size: 14px; color: var(--ink-soft); margin-top: 3px; white-space: nowrap; }
.rh-strip { display: grid; grid-template-columns: repeat(12, 22px); gap: 3px; }
.rh-strip .ps { height: 22px; border-radius: 4px; background: var(--deep); color: var(--muted); font-family: var(--font-num); font-size: 12px;
  display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); }
.rh-strip .ps.done { color: var(--line); }
.rh-strip .ps.main { border-color: var(--gold2); }
.rh-strip .ps.cur { background: var(--accent); color: var(--ink); border-color: var(--accent); font-weight: 700; }

/* ---------- タイトル ---------- */
.scr-title { background: var(--deep); }
.title-canvas { position: absolute; inset: 0; width: 1280px; height: 720px; }
.title-inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 40px; }
.marquee { padding: 6px; border-radius: 18px; background: repeating-linear-gradient(90deg, var(--gold) 0 10px, var(--gold2) 10px 20px);
  box-shadow: 0 0 40px color-mix(in srgb, var(--gold) 35%, transparent); animation: marquee-run 1.2s linear infinite; background-size: 40px 100%; }
.marquee-in { padding: 18px 54px 16px; border-radius: 13px; background: radial-gradient(ellipse at 50% 0%, var(--panel2), var(--deep)); text-align: center; }
.logo-kicker { font-family: var(--font-num); letter-spacing: .5em; font-size: 13px; color: var(--muted); }
.logo { margin: 6px 0 0; font-family: var(--font-display); font-weight: 400; font-size: 76px; line-height: 1.05; letter-spacing: .02em;
  color: var(--gold); text-shadow: 0 3px 0 var(--gold2), 0 6px 0 var(--deep), 0 0 32px color-mix(in srgb, var(--gold) 55%, transparent); display: flex; gap: 12px; }
.logo span:last-child { color: var(--ink); text-shadow: 0 3px 0 var(--muted), 0 6px 0 var(--deep), 0 0 32px color-mix(in srgb, var(--accent) 45%, transparent); }
.logo-en { font-family: var(--font-num); font-weight: 700; letter-spacing: .9em; font-size: 16px; color: var(--accent); margin-top: 6px; padding-left: .9em; }
.push-start { margin-top: 30px; appearance: none; border: 0; background: transparent; cursor: pointer; font-family: var(--font-num); font-weight: 700; font-size: 42px;
  letter-spacing: .25em; color: var(--ink); text-shadow: 0 0 18px var(--accent), 0 0 4px var(--accent); padding: 4px 20px 4px 30px; animation: blink 1.1s steps(1) infinite; }
.push-start:hover, .push-start:focus-visible { color: var(--gold); animation-duration: .4s; }
.title-medals { margin-top: 10px; display: flex; align-items: center; gap: 22px; font-size: 16px; color: var(--ink-soft); padding: 6px 18px; border-radius: 22px; background: var(--glass); border: 1px solid var(--line); }
.title-medals .tw { display: inline-flex; align-items: center; gap: 8px; }
.title-medals b { color: var(--gold); font-size: 24px; }
.title-medals b.cash { color: var(--cash); }
.howto { list-style: none; margin: 18px 0 0; padding: 12px 22px; display: flex; flex-direction: column; gap: 6px; border-radius: var(--r);
  background: var(--glass); border: 1px solid var(--line); font-size: 16px; }
.howto li { display: flex; align-items: center; gap: 12px; }
.howto b { display: inline-flex; width: 24px; height: 24px; border-radius: 50%; align-items: center; justify-content: center; background: var(--accent);
  font-family: var(--font-num); font-size: 14px; }
.title-btns { margin-top: 14px; display: flex; gap: 10px; }
.title-btns .btn { background: var(--glass); }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .15; } }
@keyframes marquee-run { to { background-position: 40px 0; } }

/* ---------- 出馬表 ---------- */
.pg-wrap { flex: 1; min-height: 0; overflow: auto; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); }
.pg-table { width: 100%; border-collapse: collapse; font-size: 14px; --rowh: 32px; }
.pg-table th { position: sticky; top: 0; z-index: 1; background: var(--panel2); color: var(--muted); font-weight: 500; font-size: 12px; height: 28px; padding: 0 6px;
  border-bottom: 1px solid var(--line); white-space: nowrap; }
.pg-table td { height: var(--rowh); padding: 0 6px; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); text-align: center; white-space: nowrap; }
.pg-table .l { text-align: left; }
.pg-table tbody tr { cursor: pointer; }
.pg-table tbody tr:hover td:not(.c-frame), .pg-table tbody tr:focus-visible td:not(.c-frame) { background: var(--panel2); }
.pg-table tbody tr:focus-visible { box-shadow: inset 0 0 0 2px var(--gold); }
.pg-table .c-frame { width: 30px; font-family: var(--font-num); font-weight: 700; font-size: 15px; border-bottom-color: transparent; }
.pg-table .c-frame.cont { border-top: 0; }
.pg-table .c-no { width: 36px; font-size: 18px; font-weight: 700; }
.pg-table .c-name { min-width: 168px; }
.pg-table .c-name b { font-size: 16px; font-weight: 700; margin-right: 6px; }
.pg-table .c-name small { color: var(--muted); font-size: 11px; }
.pg-table .c-jockey { display: table-cell; }
.pg-table .c-jockey span { margin-left: 5px; vertical-align: middle; }
.pg-table .c-odds { font-size: 17px; font-weight: 700; color: var(--ink-soft); }
.pg-table .c-odds.hot { color: var(--accent); }
.pg-table .c-bw small { margin-left: 2px; font-family: var(--font-num); color: var(--muted); }
.bw-up { color: var(--warn) !important; } .bw-down { color: var(--down) !important; }
.pg-table tr.top1 .c-name b { color: var(--gold); }
.style-tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 12px; background: var(--panel2); color: var(--ink-soft); }
.st-逃げ { background: color-mix(in srgb, var(--accent) 30%, var(--panel2)); }
.st-先行 { background: color-mix(in srgb, var(--warn) 25%, var(--panel2)); }
.st-差し { background: color-mix(in srgb, var(--down) 25%, var(--panel2)); }
.st-追込 { background: color-mix(in srgb, var(--gl) 30%, var(--panel2)); }
.form-dots { display: inline-flex; gap: 3px; }
.fd { display: inline-flex; width: 20px; height: 20px; border-radius: 50%; align-items: center; justify-content: center; font-style: normal;
  font-family: var(--font-num); font-size: 12px; font-weight: 700; background: var(--panel2); color: var(--muted); }
.fd small { font-size: 10px; }
.fd.fd1 { background: var(--gold); color: var(--ink-dark); } .fd.fd2 { background: var(--silver); color: var(--ink-dark); }
.fd.fd3 { background: var(--bronze); color: var(--ink-dark); } .fd.fd5 { background: var(--line); color: var(--ink); }
.form-new { font-size: 12px; color: var(--warn); }
.pg-foot { display: flex; align-items: center; gap: 14px; flex: none; }
.pg-foot .tipster { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--ink-soft); }
.pg-foot .tipster .mark { margin-left: 6px; }
.pg-foot .hint { font-size: 12px; color: var(--muted); }
.pg-foot .btns { margin-left: auto; display: flex; gap: 10px; }

/* ---------- 詳細ポップ・モーダル ---------- */
.modal { position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: rgba(3, 5, 10, .7); }
.modal-card { width: 640px; max-height: 660px; overflow: auto; background: var(--panel); border: 1px solid var(--gold2); border-radius: 14px; padding: 20px 24px; box-shadow: var(--shadow);
  animation: pop-in .18s ease-out; }
.modal-card.modal-wide { width: 900px; }
.modal-card.modal-narrow { width: 460px; }
.modal-h { margin: 0 0 14px; font-family: var(--font-display); font-weight: 400; font-size: 26px; color: var(--gold); }
.modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
@keyframes pop-in { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
.hd-head { display: flex; align-items: center; gap: 16px; padding-bottom: 12px; border-bottom: 3px solid var(--fc, var(--line)); }
.hd-name { flex: 1; min-width: 0; }
.hd-name h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 30px; }

/* ---------- 馬券（マークシート） ---------- */

  background: var(--panel); cursor: pointer; overflow: hidden; }

/* フォーメーションの列ボタン：3 列で幅を分け合い、馬が多ければ列の中で折り返す（選択欄の高さが伸びる） */
.bt-slots.fm { height: auto; min-height: 52px; padding: 6px 10px; }

.bt-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(var(--rows, 6), 1fr); grid-auto-flow: column; gap: 6px; }
.bt-grid.bracket { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); grid-auto-flow: row; }
.bt-cell { appearance: none; position: relative; display: grid; grid-template-columns: 1fr auto; grid-template-rows: 1fr auto; column-gap: 6px; align-items: center;
  border: 1px solid var(--line); background: linear-gradient(180deg, var(--panel2), var(--panel)); border-radius: var(--r-sm); cursor: pointer; padding: 4px 10px 5px 16px;
  text-align: left; min-height: 0; overflow: hidden; transition: border-color .12s, background .12s; }
.bt-cell:hover:not(:disabled) { border-color: var(--gold2); }
.bt-cell .cell-band { position: absolute; left: 0; top: 0; bottom: 0; width: 8px; box-shadow: inset -1px 0 0 rgba(0, 0, 0, .35); }
.cell-top { display: flex; align-items: center; gap: 7px; min-width: 0; }

.cell-meta kbd { margin-left: auto; font-family: var(--font-num); font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; line-height: 14px; }
.bt-cell .tag { position: absolute; right: 6px; top: 4px; font-style: normal; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 3px; background: var(--gold); color: var(--ink-dark); }
.bt-cell.sel { border-color: var(--gold); background: linear-gradient(180deg, color-mix(in srgb, var(--gold) 26%, var(--panel2)), var(--panel)); box-shadow: 0 0 0 1px var(--gold) inset; }
.bt-cell.sel .cell-odds { visibility: hidden; }
.bt-cell.sel.partner { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok) inset; background: linear-gradient(180deg, color-mix(in srgb, var(--ok) 20%, var(--panel2)), var(--panel)); }
.bt-cell.sel.partner .tag { background: var(--ok); }

/* フォーメーション：入っている列番号の印（今の列は金、ほかの列は控えめ）。今の列に無い馬は点線の枠 */
.bt-cell .tag.fm-tag { display: inline-flex; gap: 3px; padding: 0; background: none; }
.fm-n { display: inline-block; min-width: 17px; height: 17px; line-height: 17px; border-radius: 3px; text-align: center; font-family: var(--font-num); font-size: 12px; font-weight: 700;
  background: var(--panel2); color: var(--ink); box-shadow: 0 0 0 1px var(--gold2) inset; }

.bt-cell.fm-in { border-style: dashed; border-color: var(--gold2); }

.fr-cell { grid-template-columns: 1fr; grid-template-rows: auto 1fr; align-items: start; padding: 8px; gap: 6px; }
.fr-head { display: inline-flex; align-items: baseline; gap: 2px; justify-content: center; width: 54px; height: 34px; line-height: 34px; border-radius: 6px; font-family: var(--font-num); font-size: 24px; font-weight: 700; }

.bt-sel { display: flex; align-items: center; gap: 10px; height: 28px; flex: none; }

.bt-sel .btn { margin-left: auto; }
.bt-right { width: 300px; flex: none; display: flex; flex-direction: column; gap: 8px; }
.bt-status { display: flex; gap: 8px; flex: none; }
.bt-medals, .bt-count { flex: 1; background: var(--deep); border: 1px solid var(--line); border-radius: var(--r); padding: 5px 10px; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.bt-medals span, .bt-count span { font-size: 11px; color: var(--muted); }
.bt-medals b { font-size: 26px; color: var(--gold); line-height: 1.1; }
.bt-count b { font-size: 26px; line-height: 1.1; }
.bt-count.urgent { border-color: var(--accent); }
.bt-count.urgent b { color: var(--accent); animation: blink .5s steps(1) infinite; }
.bt-bet { display: flex; flex-direction: column; gap: 5px; padding: 5px 8px 7px; background: var(--deep); border: 1px solid var(--line); border-radius: var(--r); flex: none; }
.bt-bet-row { display: flex; align-items: center; gap: 6px; }
.bt-mini { font-size: 12px; color: var(--muted); margin-right: auto; display: flex; flex-direction: column; line-height: 1.2; }
.bt-mini small { font-size: 10px; color: var(--muted); opacity: .8; }
.bt-bet-val { display: inline-flex; align-items: baseline; justify-content: flex-end; gap: 3px; min-width: 104px; }
.bt-bet-val b { font-size: 32px; font-weight: 700; color: var(--gold); line-height: 1; }
.bt-bet-val small { font-size: 12px; color: var(--muted); }
.bt-bet-val b.long { font-size: 25px; }
#btBetStep { white-space: nowrap; }

.bt-bet-val b.xxlong { font-size: 16px; }

.bt-chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.bet-chip.all { font-family: var(--font-body); letter-spacing: .08em; }
.bet-chip { appearance: none; height: 28px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft); cursor: pointer;
  font-family: var(--font-num); font-weight: 700; font-size: 13px; padding: 0; font-variant-numeric: tabular-nums; }
.bet-chip:hover { border-color: var(--gold2); color: var(--ink); }
.bet-chip.on { background: radial-gradient(circle at 35% 30%, var(--ink) 0 6%, var(--gold) 40%, var(--gold2)); color: var(--ink-dark); border-color: var(--gold); box-shadow: 0 0 10px color-mix(in srgb, var(--gold) 40%, transparent); }
.bt-preview { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 12px 5px; flex: none; }
.pv-row { display: flex; align-items: baseline; gap: 6px; height: 26px; line-height: 26px; }

.bt-buy { height: 44px; font-size: 17px; flex: none; }
.bt-tk-head { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); flex: none; }
.bt-tickets, .rs-tickets { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 4px; }

/* ---------- レース ---------- */

  background: linear-gradient(180deg, var(--panel2), var(--panel)); border-bottom: 2px solid var(--gold2); }
.rc-title { display: flex; align-items: center; gap: 8px; width: 420px; flex: none; white-space: nowrap; overflow: hidden; }
.rc-title .rc-rno { font-size: 22px; font-weight: 700; color: var(--gold); }
.rc-title b { font-family: var(--font-display); font-weight: 400; font-size: 21px; overflow: hidden; text-overflow: ellipsis; }
.rc-title .grade { margin-left: 0; }
.rc-title small { font-size: 13px; color: var(--ink-soft); }
.rc-remain { flex: 1; display: flex; align-items: center; gap: 14px; min-width: 0; }
.rc-remain-label { display: flex; align-items: baseline; gap: 4px; width: 150px; flex: none; justify-content: flex-end; }
.rc-remain-label span { font-size: 13px; color: var(--ink-soft); }
.rc-remain-label b { font-size: 34px; color: var(--gold); font-weight: 700; text-align: right; line-height: 1; }
.rc-bar { position: relative; flex: 1; height: 14px; border-radius: 7px; background: var(--deep); border: 1px solid var(--line); }
.rc-bar-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 7px; background: linear-gradient(90deg, var(--turf), var(--gold)); }

.rc-bar-horse { position: absolute; top: 50%; left: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px var(--gold); }

.rc-view { position: absolute; left: 0; top: 60px; width: 1280px; height: 560px; overflow: hidden; }
.rc-view canvas { width: 1280px; height: 560px; }
.rc-rank { position: absolute; left: 12px; top: 12px; width: 236px; background: var(--glass); border: 1px solid var(--line); border-radius: var(--r); padding: 6px; }
.rk-h { font-size: 11px; color: var(--muted); padding: 0 4px 4px; letter-spacing: .1em; }
.rk-row { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 4px; border-radius: 5px; }
.rk-row:first-of-type { background: color-mix(in srgb, var(--gold) 16%, transparent); }
.rk-row.mine .rk-name::after { content: '◆'; color: var(--accent); font-size: 10px; margin-left: 4px; }
.rk-pos { width: 16px; text-align: right; font-size: 16px; color: var(--muted); font-weight: 700; }
.rk-name { flex: 1; min-width: 0; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rk-row .no-chip { min-width: 24px; height: 22px; font-size: 14px; }
.rk-row .pop { height: 18px; line-height: 18px; font-size: 12px; min-width: 20px; }
.rc-card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 640px; padding: 24px 30px 20px; text-align: center; border-radius: 16px;
  background: radial-gradient(ellipse at 50% 0%, var(--panel2), var(--glass)); border: 2px solid var(--gold); box-shadow: 0 0 60px color-mix(in srgb, var(--gold) 30%, transparent);
  animation: card-in .6s cubic-bezier(.2, .9, .3, 1.2); }
.card-kicker { font-size: 14px; color: var(--gold); letter-spacing: .3em; }

/* ===== mobile-base.css ===== */
/* ======================================================================
 * mobile-base.css — iPhone（compact）用の土台＋メニュー系画面（担当 A。SPEC-mobile.md §1〜§3）
 * セレクタは必ず .stage.is-compact で始める（PC＝クラス無しには一切効かない）
 * 共通の変数（担当 B も使ってよい）:
 *   --sa-t/--sa-r/--sa-b/--sa-l  安全領域（ノッチ・ホームバー）
 *   --pad-l/--pad-r              左右の余白（安全領域込み）
 *   --tb-h / --tb-top            上部バーの高さ（安全領域を除く／含む）
 *   --dock-pb                    下部ドックの下余白（ホームバー込み）
 *   --dock-h                     下部ドック 1 段（ボタン 52px）の高さ
 * ====================================================================== */

/* ---------- 土台：fixed 全画面・安全領域・タッチ ---------- */
.stage.is-compact {
  --sa-t: env(safe-area-inset-top, 0px); --sa-r: env(safe-area-inset-right, 0px);
  --sa-b: env(safe-area-inset-bottom, 0px); --sa-l: env(safe-area-inset-left, 0px);
  --pad-l: max(12px, var(--sa-l)); --pad-r: max(12px, var(--sa-r));

  --dock-pb: max(10px, var(--sa-b)); --dock-h: calc(52px + 8px + var(--dock-pb));
  position: fixed; inset: 0; left: 0; top: 0; width: 100%; height: 100%; transform: none; transform-origin: 0 0;
  box-shadow: none; font-size: 14px; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  overflow: hidden; overflow: clip;   /* フォーカスや scrollIntoView でステージ自体がずれないように */
}
.stage.is-compact.is-landscape { --tb-h: 44px; }
.stage.is-compact * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.stage.is-compact button, .stage.is-compact .btn { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.stage.is-compact .screen { overscroll-behavior: contain; }
.stage.is-compact .screen.with-bar { top: var(--tb-top); padding: 8px var(--pad-r) 0 var(--pad-l); gap: 8px; }
/* 縦スクロール領域の共通指定 */
.stage.is-compact .m-scroll, .stage.is-compact .pg-wrap, .stage.is-compact .pd-body, .stage.is-compact .rs-body {
  overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
}
/* ボタンの最小タップ領域（44px） */
.stage.is-compact .btn { min-height: 44px; font-size: 15px; }
.stage.is-compact .btn-sm, .stage.is-compact .btn-xs { min-height: 44px; height: 44px; font-size: 14px; }
.stage.is-compact .btn-lg { height: 52px; font-size: 17px; }
.stage.is-compact .btn-icon { min-width: 44px; width: 44px; height: 44px; }
.stage.is-compact .btn:hover:not(:disabled) { border-color: var(--line); }

/* キーボード操作の説明は出さない */

/* ---------- 下部ドック（共通） ---------- */

  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; align-items: stretch;
  padding: 8px var(--pad-r) var(--dock-pb) var(--pad-l);
  background: linear-gradient(180deg, var(--panel), var(--deep)); border-top: 1px solid var(--gold2);
}

  height: 52px; min-height: 52px; padding: 0 8px; font-size: 15px; white-space: normal; line-height: 1.15; text-align: center;

/* ===== mobile-play.css ===== */
/* ======================================================================
 * mobile-play.css — iPhone（compact）用：馬券画面・レース画面（担当 B。SPEC-mobile.md §3）

      wide: widePool, wideTotal: WIDE_POOL_TOTAL };

  }

     * exact=true（スロット）：保存時の state（program/paddock/betting/result）へそのまま戻す。
     */
    function restoreMeeting(d, exact) {
      var m = d.meeting, phase = d.phase;
      S.meeting = makeMeeting(m.round, m.dayNo, m.raceNo, m.seed);
      S.program = buildProgram(S.meeting);
      if (phase === 'gameover' || (phase === 'result' && !exact)) {   // 払戻済みなら次のレースへ進める
        advanceMeeting();
        loadRace();
        S.state = 'program';
        return;
      }
      loadRace();
      var n = Math.min(Math.max(0, Math.floor(Number(d.driftCount)) || 0), DRIFT_REPLAY_MAX);
      for (var i = 0; i < n; i++) { S.race = E.driftOdds(S.race, driftRng); driftCount++; }
      var settled = phase === 'result', tickets = [];
      (Array.isArray(d.tickets) ? d.tickets : []).forEach(function (t) {
        if (!t || TYPES.indexOf(t.type) < 0) return;
        var method = METHODS.indexOf(t.method || 'normal') >= 0 ? (t.method || 'normal') : '';   // 未知の買い方は返金
        var sel = selectionOf(t, t.type, method);                     // フォーメーションは保存した cols から再展開
        var combos = method ? E.expandCombos(t.type, method, sel, S.race) : [], bet = Number(t.bet);
        if (!combos.length || !validBet(bet)) {                          // 復元できない馬券は返金（払戻済みなら捨てる）
          if (!settled) S.medals += isNum(t.cost) && t.cost > 0 ? t.cost : 0;
          return;
        }
        var seq = Number(String(t.id || '').replace(/\D/g, '')) || 0;
        if (seq > ticketSeq) ticketSeq = seq;
        tickets.push(makeTicket(String(t.id), t.type, method, sel, combos, bet));
      });
      S.tickets = tickets.slice(0, MAX_TICKETS);
      if (phase === 'race') {                // レース中に閉じた場合は発走済みの状態へ（結果を見てから買い直せないように）
        S.oddsLocked = true;
        S.result = E.simulateRace(S.race, S.race.seed);
        S.state = 'race';
      } else if (settled) {                  // スロットの払戻画面：精算結果だけ作り直す（メダル・統計は保存値のまま）
        S.oddsLocked = true;
        S.result = E.simulateRace(S.race, S.race.seed);
        settle(false);
        S.state = 'result';
      } else if (exact && (phase === 'paddock' || phase === 'betting')) S.state = phase;
      else S.state = 'program';
    }

    // ---------------- 保存・読み込み ----------------
    /** 保存データ 1 件を検証して返す（文字列なら JSON として解釈。壊れていれば null） */
    function parseSave(raw) {
      try {
        if (typeof raw === 'string') raw = JSON.parse(raw);
        if (!raw || typeof raw !== 'object' || raw.v !== SAVE_VERSION) return null;
        return raw;
      } catch (e) { return null; }
    }
    /** キーの保存データを読む（storage の例外は null） */
    function readKey(key) {
      try { return parseSave(store.get(key)); } catch (e) { return null; }
    }
    /** 現在の完全な状態（オートセーブとスロットで共通）。開始前で未復元の開催はオートセーブの内容をそのまま引き継ぐ */
    function snapshot() {
      var body;
      if (!S.meeting && loaded && validMeeting(loaded.meeting)) {
        body = { meeting: loaded.meeting, phase: loaded.phase, driftCount: loaded.driftCount, tickets: loaded.tickets,
          meetingLabel: loaded.meetingLabel || meetingLabelOf(loaded.meeting), raceName: loaded.raceName || '' };
      } else {
        var m = S.meeting;
        body = {
          meeting: m ? { round: m.round, dayNo: m.dayNo, raceNo: m.raceNo, seed: m.seed } : null,
          phase: S.state, driftCount: driftCount,
          tickets: S.tickets.map(function (t) {
            return { id: t.id, type: t.type, method: t.method, picks: t.picks, axis: t.axis, partners: t.partners, cols: t.cols, bet: t.bet, cost: t.cost };
          }),
          meetingLabel: meetingLabelOf(m), raceName: S.race ? String(S.race.name || '') : ''
        };
      }
      return deepCopy(Object.assign({
        v: SAVE_VERSION, savedAt: new Date().toISOString(),
        medals: S.medals, cash: S.cash, stats: S.stats, settings: S.settings
      }, body));
    }
    /** オートセーブ（storage の例外は握りつぶす） */
    function save() {
      try { store.set(SAVE_KEY, snapshot()); } catch (e) { /* 保存できなくても遊べる */ }
    }
    /** スロットの要約（listSlots / view.slots の 1 行） */
    function slotSummary(n, d) {
      if (!d) return emptySlot(n);
      return {
        n: n, empty: false, savedAt: typeof d.savedAt === 'string' ? d.savedAt : null,
        medals: nonNegInt(d.medals, 0), cash: nonNegInt(d.cash, 0),
        meetingLabel: String(d.meetingLabel || (validMeeting(d.meeting) ? meetingLabelOf(d.meeting) : '')),
        raceName: String(d.raceName || ''), state: STATES.indexOf(d.phase) >= 0 ? d.phase : 'title'
      };
    }
    /** スロット一覧のキャッシュを storage から読み直す */
    function refreshSlots() {
      slotsCache = [];
      for (var n = 1; n <= SLOT_COUNT; n++) slotsCache.push(slotSummary(n, readKey(slotKey(n))));
      return slotsCache;
    }
    /** スロットの一覧（コピー） */
    function slotsCopy() { return slotsCache.map(function (s) { return Object.assign({}, s); }); }
    /** 保存データのメダル・現金・統計を取り込む（設定は呼び出し側で判断） */
    function applyWallet(d) {
      S.medals = nonNegInt(d.medals, INITIAL);
      S.cash = nonNegInt(d.cash, INITIAL_CASH);
      S.stats = sanitizeStats(d.stats);
    }

    // ---------------- 精算 ----------------
    /**
     * 確定配当を馬券に当てはめ settlement を作る。払戻は的中組み合わせごとに floor(オッズ × 賭け額)。
     * apply=true でメダル加算と統計更新、false は表示の作り直しだけ（スロットの払戻画面の復元用）。
     */
    function settle(apply) {
      var dividends = E.settleDividends(S.race, S.result), byKey = {};
      TYPES.forEach(function (type) {
        byKey[type] = {};
        (dividends[type] || []).forEach(function (x) { byKey[type][x.key] = x; });
      });
      var bet = 0, pay = 0, hits = [], biggest = null, maxTicketPay = 0, maxOdds = 0, manbaken = false;
      S.tickets.forEach(function (t) {
        t.hit = false; t.pay = 0; t.hitKeys = [];
        t.combos.forEach(function (key) {
          if (!E.isWinning(t.type, key, S.result)) return;
          var div = byKey[t.type] && byKey[t.type][key];
          if (!div) return;
          var p = E.payoutFor(div.odds, t.bet);
          t.pay = Math.min(MEDAL_CAP, t.pay + p); t.hitKeys.push(key);
          if (div.odds >= MANBAKEN_ODDS) manbaken = true;
          if (div.odds > maxOdds) maxOdds = div.odds;
          if (!biggest || div.odds > biggest.odds) biggest = { odds: div.odds, pay: p };
        });
        t.hit = t.hitKeys.length > 0;
        bet += t.cost; pay = Math.min(MEDAL_CAP, pay + t.pay);
        if (t.pay > maxTicketPay) maxTicketPay = t.pay;
        if (t.hit) hits.push(Object.assign({}, t));
      });
      var before = apply ? S.medals : S.medals - pay;
      if (apply) S.medals = Math.min(MEDAL_CAP, S.medals + pay);   // 9,000 兆で止まる（カウンターストップ）
      S.dividends = dividends;
      S.settlement = { bet: bet, pay: pay, net: pay - bet, hits: hits, biggest: biggest, medalsBefore: before, medalsAfter: S.medals };
      if (!apply || !S.tickets.length) return;     // 観戦のみ：統計には数えない
      var st = S.stats;
      st.races++; st.betTotal += bet; st.payTotal += pay;
      if (pay > 0) { st.hitRaces++; st.streak++; if (st.streak > st.bestStreak) st.bestStreak = st.streak; } else st.streak = 0;
      if (maxTicketPay > st.maxPay) st.maxPay = maxTicketPay;
      if (maxOdds > st.maxOdds) st.maxOdds = maxOdds;
      if (manbaken) st.manbaken++;
      S.tickets.forEach(function (t) {
        var b = st.byType[t.type] || (st.byType[t.type] = { bets: 0, hits: 0, pay: 0 });
        b.bets++; if (t.hit) b.hits++; b.pay += t.pay;
      });
      st.history.unshift({ raceId: S.race.id, name: S.race.name || '', bet: bet, pay: pay });
      if (st.history.length > MAX_HISTORY) st.history.length = MAX_HISTORY;
    }

    /** 今レースの購入額 */
    function ticketTotal() { return S.tickets.reduce(function (a, t) { return a + t.cost; }, 0); }

    // ---------------- 馬券の指定 ----------------
    /** 馬券の指定（picks/axis/partners/cols）を検証済みの形にする。cols はフォーメーションのときだけ券種の頭数ぶん持つ */
    function selectionOf(spec, type, method) {
      var cols = method === 'formation' ? colsArray(spec.cols).slice(0, BET_SIZE[type] || 0) : [];
      return { picks: intArray(spec.picks), axis: intArray(spec.axis), partners: intArray(spec.partners), cols: cols };
    }
    /** 検証済みの指定から Ticket を作る（combos は呼び出し側で展開済み） */
    function makeTicket(id, type, method, sel, combos, bet) {
      return { id: id, type: type, method: method, combos: combos, bet: bet, cost: E.comboCost(combos, bet),
        picks: sel.picks, axis: sel.axis, partners: sel.partners, cols: sel.cols };
    }

    // ---------------- ゲームオーバー ----------------
    /**
     * 続行不能か（SPEC-v4 §2：medals < 500 かつ cash × 3 < 500＝現金を全額メダルにしても 500 枚に届かない）。
     * 未精算の馬券がある間・race 中・title は判定しない
     */
    function isBroke() {
      if (S.state === 'title' || S.state === 'race' || S.state === 'gameover') return false;
      if (S.state !== 'result' && S.tickets.length) return false;
      return S.medals + S.cash * MEDALS_PER_YEN < MIN_BET;   // 現金を全部メダルにしても 1 点（500 枚）買えない
    }
    /** ゲームオーバー画面用の要約 */
    function gameOverInfo() {
      var st = S.stats;
      return {
        medals: S.medals, cash: S.cash, at: new Date().toISOString(),
        meeting: S.meeting ? Object.assign({}, S.meeting) : null, meetingLabel: meetingLabelOf(S.meeting),
        stats: {
          races: st.races, hitRaces: st.hitRaces, hitRate: st.races ? st.hitRaces / st.races : 0,
          betTotal: st.betTotal, payTotal: st.payTotal, returnRate: st.betTotal ? st.payTotal / st.betTotal : 0,
          maxPay: st.maxPay, maxOdds: st.maxOdds, manbaken: st.manbaken, bestStreak: st.bestStreak,
          medalsBought: st.medalsBought, cashOuts: st.cashOuts, cashIn: st.cashIn, cashOutYen: st.cashOutYen
        }
      };
    }
    /** 条件成立なら gameover へ移る（移ったら true）。保存は呼び出し側 */
    function enterGameOverIfBroke() {
      if (!isBroke()) return false;
      S.state = 'gameover';
      S.gameOver = gameOverInfo();
      return true;
    }

    // ---------------- 公開 API ----------------
    var game = {
      /** 現在の画面状態 */
      get state() { return S.state; },

      /** UI が読む View（毎回新しい浅いコピー） */
      getView: function () {
        return {
          state: S.state, medals: S.medals, cash: S.cash,
          meeting: S.meeting ? Object.assign({}, S.meeting) : null,
          program: S.program.slice(),
          race: S.race, odds: S.race ? S.race.odds : null, oddsLocked: S.oddsLocked,
          tickets: S.tickets.map(function (t) { return Object.assign({}, t, { cols: (t.cols || []).map(function (c) { return c.slice(); }) }); }),
          ticketTotal: ticketTotal(),
          result: S.result, dividends: S.dividends, settlement: S.settlement,
          gameOver: S.gameOver ? Object.assign({}, S.gameOver, { stats: Object.assign({}, S.gameOver.stats) }) : null,
          slots: slotsCopy(), betPresets: BET_PRESETS.slice(), medalsPerYen: MEDALS_PER_YEN,
          stats: copyStats(S.stats),
          settings: Object.assign({}, S.settings)
        };
      },

      /** title→program。オートセーブがあれば開催を復元、無ければ新しい開催 */
      start: function () {
        if (S.state !== 'title') return ok();            // 開始済みなら何もしない
        try {
          if (!S.meeting) {
            if (loaded && validMeeting(loaded.meeting) && fixedSeed === null) {
              try { restoreMeeting(loaded, false); } catch (e) { clearMeeting(); newMeeting(); }   // 復元できなければ（メダル・統計は残して）新規開催
            } else newMeeting();
            loaded = null;
          }
        } catch (e) { return ng('開催を準備できませんでした'); }
        if (S.state === 'title') S.state = 'program';
        enterGameOverIfBroke();
        save();
        return ok();
      },

      /** program→paddock */
      toPaddock: function () {
        if (S.state === 'paddock') return ok();
        if (S.state !== 'program') return ng('今はパドックへ行けません');
        S.state = 'paddock'; save();
        return ok();
      },

      /** paddock/program→betting */
      toBetting: function () {
        if (S.state === 'betting') return ok();
        if (S.state !== 'program' && S.state !== 'paddock') return ng('今は馬券を買えません');
        S.state = 'betting'; save();
        return ok();
      },

      /** paddock/betting→program（馬券はそのまま） */
      toProgram: function () {
        if (S.state === 'program') return ok();
        if (S.state !== 'paddock' && S.state !== 'betting') return ng('今は出馬表へ戻れません');
        S.state = 'program'; save();
        return ok();
      },

      /** 発走前のオッズ変動（betting 中のみ。締切後は何もしない） */
      driftOdds: function () {
        if (S.state !== 'betting') return ng('今はオッズが動きません');
        if (S.oddsLocked) return ok({ drifted: false });
        S.race = E.driftOdds(S.race, driftRng);
        driftCount++;
        return ok({ drifted: true });
      },

      /**
       * 馬券を追加（検証→メダル減算）。spec = { type, method, picks|axis+partners|cols, bet }。
       * bet は整数で MIN_BET〜MAX_BET、購入額 = 組み合わせ数 × bet。method:'formation' は cols（列ごとの馬番配列）で指定
       */
      addTicket: function (spec) {
        if (S.state !== 'betting' || S.oddsLocked) return ng('今は馬券を買えません');
        if (!spec || typeof spec !== 'object') return ng('馬券の指定が正しくありません');
        if (TYPES.indexOf(spec.type) < 0) return ng('券種が正しくありません');
        var method = spec.method || 'normal';
        if (METHODS.indexOf(method) < 0) return ng('買い方が正しくありません');
        var bet = typeof spec.bet === 'number' || typeof spec.bet === 'string' ? Number(spec.bet) : NaN;
        if (!validBet(bet)) return ng('ベット額が不正です');
        if (S.tickets.length >= MAX_TICKETS) return ng('馬券は 1 レース ' + MAX_TICKETS + ' 枚までです');
        var sel = selectionOf(spec, spec.type, method);
        var combos = E.expandCombos(spec.type, method, sel, S.race);
        if (!combos.length) return ng('組み合わせがありません');
        var ticket = makeTicket('t' + (ticketSeq + 1), spec.type, method, sel, combos, bet);
        if (ticket.cost > S.medals) return ng('メダルが足りません');
        ticketSeq++;
        S.tickets.push(ticket);
        S.medals -= ticket.cost;
        save();
        return ok({ ticket: Object.assign({}, ticket, { cols: ticket.cols.map(function (c) { return c.slice(); }) }) });
      },

      /** 馬券を取り消して返金 */
      removeTicket: function (id) {
        if (S.state !== 'betting' || S.oddsLocked) return ng('今は馬券を取り消せません');
        var t = S.tickets.filter(function (x) { return x.id === id; })[0];
        if (!t) return ng('その馬券はありません');
        S.tickets = S.tickets.filter(function (x) { return x !== t; });
        S.medals += t.cost;
        enterGameOverIfBroke();
        save();
        return ok({ refund: t.cost });
      },

      /** 馬券を全部取り消して返金 */
      clearTickets: function () {
        if (S.state !== 'betting' || S.oddsLocked) return ng('今は馬券を取り消せません');
        var refund = ticketTotal();
        S.medals += refund; S.tickets = [];
        enterGameOverIfBroke();
        save();
        return ok({ refund: refund });
      },

      /** 締切：オッズ確定→レース結果を計算して betting→race */
      closeBetting: function () {
        if (S.state !== 'betting') return ng('今は発走できません');
        S.oddsLocked = true;
        S.result = E.simulateRace(S.race, S.race.seed);
        S.state = 'race';
        save();
        return ok();
      },

      /** 払戻：race→result（続行不能なら gameover。settlement・dividends は gameover でも View に残る） */
      finishRace: function () {

        var over = enterGameOverIfBroke();

        return ok({ settlement: S.settlement, gameOver: over });
      },

      /** 次のレースへ：result→program（gameover 中は不可） */
      nextRace: function () {
        if (S.state === 'gameover') return ng('ゲームオーバーです');
        if (S.state !== 'result') return ng('まだ次のレースへ進めません');

        S.state = 'program';
        enterGameOverIfBroke();
        save();
        return ok();
      },

      /**
       * 窓口：現金 yen 円（既定 10,000、1 以上の整数）でメダル yen × 3 枚を買う（race・gameover 中は不可）。
       * 戻り値 {ok, medals, cash, yen, medalsIn}
       */
      buyMedals: function (yen) {
        if (S.state === 'race') return ng('レース中はメダルを買えません');
        var y = yenArg(yen, PACK_YEN);
        if (!isNum(y)) return ng(MSG_BAD_YEN);

        if (S.state === 'gameover') return ng('ゲームオーバーです');

      },

      /**
       * 窓口：メダル yen × 3 枚を現金 yen 円（既定 10,000、1 以上の整数）に換える（title/program/paddock/result のみ）。
       * 戻り値 {ok, medals, cash, yen, medalsOut}
       */
      cashOut: function (yen) {
        if (CASHOUT_STATES.indexOf(S.state) < 0) {
          return ng(S.state === 'betting' ? '馬券の購入中は換金できません' : (S.state === 'race' ? 'レース中は換金できません' : '今は換金できません'));
        }
        var y = yenArg(yen, PACK_YEN);
        if (!isNum(y)) return ng(MSG_BAD_YEN);
        var pay = y * MEDALS_PER_YEN;
        if (pay > S.medals) return ng('メダルが足りません');
        S.medals -= pay; S.cash += y;
        S.stats.cashOuts++; S.stats.cashOutYen += y;
        enterGameOverIfBroke();
        save();
        return ok({ medals: S.medals, cash: S.cash, yen: y, medalsOut: pay });
      },

      /** ゲームオーバー判定（medals < 500 かつ cash × 3 < 500 で state='gameover'）。{ok:true, gameOver} */
      checkGameOver: function () {
        if (enterGameOverIfBroke()) save();
        return ok({ gameOver: S.state === 'gameover' });
      },

      /** はじめから：開催・メダル(30,000)・現金(100,000)・統計を初期化して title（設定・スロットは維持） */
      restart: function () {
        clearMeeting();
        S.medals = INITIAL; S.cash = INITIAL_CASH; S.stats = newStats(); S.state = 'title';
        loaded = null;
        save();
        return ok();
      },

      /** 手動セーブ（n=1..3。race・gameover 中は不可） */
      saveSlot: function (n) {
        var key = slotKey(n);
        if (!key) return ng('スロット番号が不正です');
        if (S.state === 'race') return ng('レース中はセーブできません');
        if (S.state === 'gameover') return ng('ゲームオーバー中はセーブできません');
        var d = snapshot(), back = null;
        try { store.set(key, d); back = readKey(key); } catch (e) { back = null; }
        refreshSlots();

        return ok({ slot: slotSummary(Number(n), d) });
      },

      /** 手動ロード（n=1..3。保存時の state へ戻す。race 中は不可。設定は今のまま） */
      loadSlot: function (n) {
        var key = slotKey(n);
        if (!key) return ng('スロット番号が不正です');
        if (S.state === 'race') return ng('レース中はロードできません');
        var d = readKey(key);
        if (!d) return ng('空きスロットです');
        var prev = Object.assign({}, S), prevSeq = ticketSeq, prevRng = driftRng, prevCount = driftCount, prevLoaded = loaded;
        try {
          clearMeeting();
          applyWallet(d);
          S.state = 'title';
          if (validMeeting(d.meeting)) restoreMeeting(d, true);
          loaded = null;
        } catch (e) {
          S = prev; ticketSeq = prevSeq; driftRng = prevRng; driftCount = prevCount; loaded = prevLoaded;
          return ng('ロードできませんでした');
        }
        enterGameOverIfBroke();
        save();
        return ok({ state: S.state });
      },

      /** スロットを空にする（n=1..3） */
      deleteSlot: function (n) {
        var key = slotKey(n);
        if (!key) return ng('スロット番号が不正です');

  /** id 付き要素をキャッシュ */
  function cacheEls() {
    els = {};
    $$('[id]', ROOT).forEach(function (el) { els[el.id] = el; });
  }

  // ======================================================================
  // 画面切替と同期
  // ======================================================================
  var BAR_SCREENS = { program: true, paddock: true, betting: true, result: true };
  var ENTER = {}, LEAVE = {}, RENDER = {};

  /** 画面を切り替える（leave → enter） */
  function showScreen(name) {
    if (screen === name) { if (RENDER[name]) guard(RENDER[name])(); return; }
    var prev = screen;
    if (els.modal && !els.modal.hidden) { modalState = null; els.modal.hidden = true; els.modalCard.innerHTML = ''; STAGE.classList.remove('modal-open'); }
    if (prev && LEAVE[prev]) guard(LEAVE[prev])();
    screen = name;
    $$('.screen').forEach(function (s) { s.hidden = s.getAttribute('data-screen') !== name; });
    els.topbar.hidden = !BAR_SCREENS[name];
    STAGE.setAttribute('data-screen', name);
    if (ENTER[name]) guard(ENTER[name])();
  }
  /** game の View を読み、画面を合わせる */
  function sync() {
    if (RV && RV.standalone && screen === 'race') return;
    var v = getView();
    if (!v) return;
    view = v;
    updateTopbar();
    showScreen(v.state || 'title');
  }
  /** 画面を強制的に入り直す準備（現在画面の LEAVE を呼んでから空にする） */
  function resetScreen() {
    if (screen && LEAVE[screen]) guard(LEAVE[screen])();
    screen = '';
  }
  /** 上部バー（開催・メダル・現金・窓口/セーブ/ロード）を更新 */
  function updateTopbar() {
    if (!view) return;
    var m = view.meeting || {};
    var rn = (view.race && view.race.no) || m.raceNo || '';
    els.tbMeeting.innerHTML = '<span>' + meetingText(m) + '</span>' + (rn ? '<b class="num">' + rn + '<small>R</small></b>' : '');
    if (!countingUp) els.tbMedals.textContent = fmt(view.medals);
    els.tbCash.textContent = yen(view.cash);
    tbFit();
    var busy = view.state === 'race' || view.state === 'gameover';
    els.tbWindow.disabled = busy; els.tbSave.disabled = busy; els.tbLoad.disabled = busy;
    var why = busy ? (view.state === 'race' ? 'レース中は使えません' : '') : '';
    [els.tbWindow, els.tbSave, els.tbLoad].forEach(function (b) { if (why) b.title = why; else b.removeAttribute('title'); });
    updateMuteButtons();
  }
  /** ミュートボタンの見た目 */
  function updateMuteButtons() {
    var s = settings(), muted = !(Number(s.sfx) > 0) && !(Number(s.voice) > 0);
    $$('.mute-btn').forEach(function (b) { b.classList.toggle('is-muted', muted); b.setAttribute('aria-pressed', muted ? 'true' : 'false'); });
  }
  /** 音 ON/OFF */
  function toggleMute() {
    var s = settings();
    if (Number(s.sfx) > 0 || Number(s.voice) > 0) {
      muteMemory = { sfx: s.sfx, voice: s.voice };
      applySettings({ sfx: 0, voice: 0 });
      acall('hoofs', 'stop'); acall('crowd', 'stop');
      toast('音をオフにしました');
    } else {
      applySettings(muteMemory || { sfx: 0.8, voice: 0.8 });
      sfx('click');
      if (RV && RV.phase === 'run') { acall('hoofs', 'start', 1); acall('crowd', 'start'); }
      toast('音をオンにしました');
    }
  }
  /** compact：見出しの 12R 帯を、現在のレースが真ん中に見える位置まで横スクロールする（表示後に呼ぶ） */
  function revealCurrentRace(head) {
    if (!LAYOUT.compact || !head) return;
    var strip = head.querySelector('.rh-strip'), cur = strip && strip.querySelector('.ps.cur');
    if (!cur || strip.scrollWidth <= strip.clientWidth) return;
    var d = cur.getBoundingClientRect().left - strip.getBoundingClientRect().left;
    strip.scrollLeft = Math.max(0, strip.scrollLeft + d - (strip.clientWidth - cur.offsetWidth) / 2);
  }
  /** レースの見出し（番号・名前・条件・12R 帯） */
  function raceHeadHTML(v) {
    var r = v.race || {}, m = v.meeting || {};
    var no = r.no || m.raceNo || '';
    var strip = (v.program || []).map(function (p, i) {
      var n = p.no || (i + 1), cur = n === no;
      var cls = 'ps' + (cur ? ' cur' : '') + (n < no ? ' done' : '') + (p.mainRace ? ' main' : '');
      return '<span class="' + cls + '" title="' + esc((p.name || '') + ' ' + (p.grade || '')) + '">' + n + '</span>';
    }).join('');
    return '<div class="rh-no"><b class="num">' + no + '</b><small>R</small></div>' +
      '<div class="rh-main"><div class="rh-name"><span>' + esc(r.name || '') + '</span>' + gradeBadge(r.grade) + '</div>' +
      '<div class="rh-cond">' + condLine(r) + '</div></div>' +
      (strip ? '<div class="rh-strip" aria-label="本日の番組">' + strip + '</div>' : '');
  }

  // ======================================================================
  // 馬の描画（タイトル・パドック・レースで共用）
  // ======================================================================
  /**
   * 横向きの馬＋騎手を描く。(x,y)=接地点（画面座標）。
   * o = { size, facing(1|-1), angle, phase(周期), gait:'gallop'|'walk', coat, silks, no, frame, leader, mine, dim, glow, silhouette }
   */
  function drawHorse(ctx, x, y, o) {
    var size = o.size || 40, s = size / 40, f = o.facing || 1;
    ctx.save();
    ctx.translate(x, y);
    if (o.glow) {
      ctx.fillStyle = o.glow;
      ctx.beginPath(); ctx.ellipse(0, 1.5 * s, 24 * s, 6.5 * s, 0, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.42)';
    ctx.beginPath(); ctx.ellipse(-1 * s * f, 1.2 * s, 19 * s, 3.6 * s, 0, 0, TAU); ctx.fill();
    if (o.dim) ctx.globalAlpha = 0.42;
    ctx.rotate(o.angle || 0);
    ctx.scale(f * s, s);
    var gal = o.gait !== 'walk', ph = (o.phase || 0) * TAU;
    var coat = o.silhouette || o.coat || '#7b4a24';
    var dark = o.silhouette ? o.silhouette : shade(coat, -0.42), far = o.silhouette ? o.silhouette : shade(coat, -0.25);
    var bob = gal ? Math.sin(ph * 2) * 1.3 : Math.sin(ph * 2) * 0.35;
    var hoof = o.silhouette || '#16110d';
    var legW = 2.6;
    // 遠い側の脚
    drawLeg(ctx, -10, -15 + bob, ph + (gal ? 0 : 0.5) * TAU, false, gal, far, hoof, legW);
    drawLeg(ctx, 9.5, -15 + bob, ph + (gal ? 0.45 : 0.25) * TAU, true, gal, far, hoof, legW);
    // 尾
    ctx.strokeStyle = dark; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-14.5, -21 + bob);
    if (gal) ctx.quadraticCurveTo(-22, -22 + bob, -27, -17 + bob + Math.sin(ph) * 1.5);
    else ctx.quadraticCurveTo(-19, -20, -19.5 + Math.sin(ph) * 0.8, -9);
    ctx.stroke();
    // 胴・首・頭
    ctx.fillStyle = coat;
    ctx.beginPath(); ctx.ellipse(0, -18.5 + bob, 15.5, 7.2, 0, 0, TAU); ctx.fill();
    var nk = gal ? 0 : -3;
    ctx.beginPath(); ctx.moveTo(8, -24 + bob); ctx.lineTo(18, -32 + bob + nk); ctx.lineTo(22.5, -28 + bob + nk); ctx.lineTo(14.5, -14 + bob); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.ellipse(23, -29 + bob + nk, 6.4, 3.1, gal ? 0.55 : 0.9, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(18.2, -32.4 + bob + nk); ctx.lineTo(19.2, -36.6 + bob + nk); ctx.lineTo(20.8, -32.6 + bob + nk); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(9, -25 + bob); ctx.lineTo(18.5, -32.5 + bob + nk); ctx.stroke();
    if (!o.silhouette) {
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      ctx.beginPath(); ctx.ellipse(-1, -22.5 + bob, 11, 2.6, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#0c0a08';
      ctx.beginPath(); ctx.arc(22.6, -30 + bob + nk, 0.75, 0, TAU); ctx.fill();
    }
    // 近い側の脚
    drawLeg(ctx, -10.5, -15 + bob, ph + (gal ? 0.1 : 0) * TAU, false, gal, coat, hoof, legW + 0.2);
    drawLeg(ctx, 10, -15 + bob, ph + (gal ? 0.56 : 0.75) * TAU, true, gal, coat, hoof, legW + 0.2);
    // ゼッケン
    if (!o.silhouette) {
      ctx.fillStyle = '#f6f5ef';
      ctx.beginPath(); rr(ctx, -8.5, -25 + bob, 12.5, 10, 1.6); ctx.fill();
      if (o.no != null && size >= 22) {
        ctx.save(); ctx.translate(-2.2, -19.6 + bob); ctx.scale(f, 1);
        ctx.fillStyle = '#121212'; ctx.font = '700 8.6px ' + F_NUM; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(o.no), 0, 0.4);
        ctx.restore();
      }
    }
    // 騎手
    if (o.jockey !== false) drawJockey(ctx, bob * 0.5, gal, o.silks || {}, o.silhouette);
    ctx.restore();
    // 印（先頭・自分の馬・番号札）
    var top = y - (gal ? 45 : 42) * s;
    if (o.badge) {
      var br = Math.max(6.5, size * 0.17);
      ctx.fillStyle = frameColor(o.frame); ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, top - br * 0.6, br, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = frameInk(o.frame); ctx.font = '700 ' + Math.round(br * 1.25) + 'px ' + F_NUM;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(o.no), x, top - br * 0.6 + 0.5);
      top -= br * 2;
    }
    if (o.leader) {
      var ls = Math.max(5, size * 0.13);
      ctx.fillStyle = TOK.gold; ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x - ls, top - ls * 1.6); ctx.lineTo(x + ls, top - ls * 1.6); ctx.lineTo(x, top); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if (o.mine) {
      var ms = Math.max(4, size * 0.1);
      ctx.fillStyle = TOK.accent;
      ctx.beginPath(); ctx.moveTo(x, top - ms * 2); ctx.lineTo(x + ms, top - ms); ctx.lineTo(x, top); ctx.lineTo(x - ms, top - ms); ctx.closePath(); ctx.fill();
    }
  }
  /** 脚を 2 関節で描く（前脚 fore=true） */
  function drawLeg(ctx, hx, hy, p, fore, gal, color, hoof, w) {
    var sw = Math.sin(p), a1, a2;
    if (gal) {
      a1 = (fore ? 0.62 : 0.55) * sw + (fore ? 0.08 : -0.05);
      a2 = fore ? a1 - 1.25 * Math.max(0, Math.sin(p + 1.3)) : a1 + 0.95 * Math.max(0, Math.sin(p - 0.5)) - 0.28;
    } else {
      a1 = 0.32 * sw;
      a2 = fore ? a1 - 0.6 * Math.max(0, Math.sin(p + 1.2)) : a1 + 0.5 * Math.max(0, Math.sin(p - 0.4)) - 0.15;
    }
    var l1 = 8.6, l2 = 8.4;
    var kx = hx + Math.sin(a1) * l1, ky = hy + Math.cos(a1) * l1;
    var fx = kx + Math.sin(a2) * l2, fy = ky + Math.cos(a2) * l2;
    ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
    ctx.strokeStyle = hoof; ctx.lineWidth = w + 0.4;
    ctx.beginPath(); ctx.moveTo(fx - Math.sin(a2) * 1.6, fy - Math.cos(a2) * 1.6); ctx.lineTo(fx, fy); ctx.stroke();
  }
  /** 騎手（勝負服・帽子）を馬の座標系で描く */
  function drawJockey(ctx, bob, gal, silks, silhouette) {
    var base = silhouette || silks.base || '#c8102e', sub = silhouette || silks.sub || '#ffffff', pat = silks.pattern || 'solid';
    // 脚（白ズボン・ブーツ）
    ctx.lineCap = 'round';
    ctx.strokeStyle = silhouette || '#ecebe4'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0.5, -27 + bob); ctx.lineTo(5.5, -25 + bob); ctx.stroke();
    ctx.strokeStyle = silhouette || '#17130f'; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(5.5, -25 + bob); ctx.lineTo(3.4, -21.2 + bob); ctx.stroke();
    ctx.save();
    ctx.translate(0.6, -27.5 + bob);
    ctx.rotate(gal ? 1.0 : 0.22);
    // 胴（勝負服）
    ctx.beginPath(); rr(ctx, -3.7, -10, 7.4, 10.5, 2.4);
    ctx.fillStyle = base; ctx.fill();
    if (!silhouette && pat !== 'solid') {
      ctx.save(); ctx.clip(); ctx.fillStyle = sub;
      switch (pat) {
        case 'stripe': ctx.fillRect(-2.6, -11, 1.5, 12); ctx.fillRect(1.1, -11, 1.5, 12); break;
        case 'hoop': ctx.fillRect(-4, -6.2, 8, 2.8); break;
        case 'sash': ctx.beginPath(); ctx.moveTo(-4, -10); ctx.lineTo(-1, -10); ctx.lineTo(4, 0.5); ctx.lineTo(1, 0.5); ctx.closePath(); ctx.fill(); break;
        case 'check': ctx.fillRect(-3.7, -10, 3.7, 3.5); ctx.fillRect(0, -6.5, 3.7, 3.5); ctx.fillRect(-3.7, -3, 3.7, 3.5); break;
        case 'star': starPath(ctx, 0, -5, 2.8, 1.2); ctx.fill(); break;
        case 'diamond': ctx.beginPath(); ctx.moveTo(0, -8.4); ctx.lineTo(2.6, -5); ctx.lineTo(0, -1.6); ctx.lineTo(-2.6, -5); ctx.closePath(); ctx.fill(); break;
        default: break;
      }
      ctx.restore();
    }
    // 腕
    ctx.strokeStyle = pat === 'solid' ? shade(base, -0.15) : sub; ctx.lineWidth = 2.3;
    ctx.beginPath(); ctx.moveTo(1.5, -8.6); ctx.lineTo(gal ? 6.6 : 4.5, gal ? -4.5 : -2.5); ctx.stroke();
    // 頭・帽子
    ctx.fillStyle = silhouette || '#e9c39a';
    ctx.beginPath(); ctx.arc(0.6, -12.6, 2.7, 0, TAU); ctx.fill();
    ctx.fillStyle = sub;
    ctx.beginPath(); ctx.arc(0.6, -13.1, 2.9, Math.PI, TAU); ctx.fill();
    ctx.fillRect(0.6, -13.6, 4.2, 1.1);
    ctx.restore();
